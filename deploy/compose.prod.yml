# Bluff Club in production: https://bluffclub.heronevents.app, on the shared EC2 host that runs
# Heron Connect (heronmeet), beside other products (deploy/RUNBOOK.md).
#
# deploy/ship.sh copies this to /data/bluffclub/compose.prod.yml and drives it through
# /data/bluffclub/dc (deploy/dc), which is
#
#   docker compose -p bluffclub -f compose.prod.yml --env-file .env --env-file release.env
#
# .env holds OPENAI_API_KEY and HOST_PASSWORD (chmod 600, never in git). release.env holds
# IMAGE_TAG (the commit the image was built from) and PREVIOUS_IMAGE_TAG; ship.sh writes it.
#
# - One container, never more: rooms live in this process's memory.
# - No `ports:`. Visitors arrive through the heronmeet tunnel, whose cloudflared reaches this
#   container as `bluffclub` on the heronmeet network. Being on that network also puts it behind
#   heronmeet's block on the instance metadata service.
# - Hard memory and CPU limits, and oom_score_adj 500: if the host runs out of memory the kernel
#   kills this before anything that isn't ours.

name: bluffclub

services:
  web:
    image: bluffclub-web:${IMAGE_TAG:?set IMAGE_TAG (release.env, written by deploy/ship.sh)}
    # Built on the Mac and loaded by ship.sh; never look for it on a registry.
    pull_policy: never
    restart: unless-stopped
    env_file:
      - path: /data/bluffclub/.env
        required: true
    environment:
      PORT: "3000"
      AWS_EC2_METADATA_DISABLED: "true"
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/game?status=1').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    mem_limit: 512m
    cpus: 1
    oom_score_adj: 500
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      heronmeet:
        aliases: [bluffclub]

networks:
  # Created by the heronmeet stack; Heron Connect must be up first.
  heronmeet:
    external: true
